name: Export current CoreLingual

on:
  push:
    branches: [main]

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create ZIP
        run: zip -r CoreLingual_current.zip . -x '.git/*' '.github/workflows/export-current.yml'
      - name: Upload ZIP
        uses: actions/upload-artifact@v4
        with:
          name: CoreLingual_current
          path: CoreLingual_current.zip
          retention-days: 7
