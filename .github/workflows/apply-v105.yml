name: Apply v105 comparison font update

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/apply-v105.yml'

permissions:
  contents: write

jobs:
  apply-v105:
    if: ${{ !contains(github.event.head_commit.message, 'Apply v105') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Update index.html
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old_table = "text(r.a,510,cy,fit(r.a,210,17,'500',10),'500',gray,'left');"
          new_table = "text(r.a,510,cy,fit(r.a,210,18,'500',12),'500',gray,'left');"
          old_table_b = "text(r.b,750,cy,fit(r.b,210,17,'500',10),'500',gray,'left');"
          new_table_b = "text(r.b,750,cy,fit(r.b,210,18,'500',12),'500',gray,'left');"
          if old_table not in s or old_table_b not in s:
              raise SystemExit('v105 table target not found')
          s = s.replace(old_table, new_table, 1).replace(old_table_b, new_table_b, 1)
          old = """    adv.forEach((a,i)=>{
      const x=i===0?125:575;
      const iconX=i===0?85:535;
      const head=a.head.replace(/^[^ぁ-んァ-ン一-龥A-Za-z0-9]+/,'').trim();
      drawAxisIcon(head,iconX,1168,48);
      text(head,x+55,1186,fit(head,280,22,'700',14),'700',navy,'left');
      const w=wrap(a.ps.join(' '),345,17,'500',3,12);
      drawLines(w.lines,x+5,1228,w.size,'500',gray,31);
    });"""
          new = """    adv.forEach((a,i)=>{
      const x=i===0?125:575;
      const iconX=i===0?85:535;
      const bodyX=i===0?88:548;
      const head=a.head.replace(/^[^ぁ-んァ-ン一-龥A-Za-z0-9]+/,'').trim();
      drawAxisIcon(head,iconX,1168,48);
      text(head,x+55,1186,fit(head,280,22,'700',14),'700',navy,'left');
      let by=1228;
      a.ps.slice(0,2).forEach(p=>{
        const w=wrap(p,385,19,'500',1,16);
        drawLines(w.lines,bodyX,by,w.size,'500',gray,31);
        by+=34;
      });
    });"""
          if old not in s:
              raise SystemExit('v105 advice target not found')
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit v105
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .github/workflows/apply-v105.yml
          git add index.html .github/workflows/apply-v105.yml
          git commit -m 'Apply v105 comparison font update'
          git push