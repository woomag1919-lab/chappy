<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>ココロ翻訳 — ふたりの会話整理</title>
  <style>
    :root{font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif;color:#243047;background:#f6f7fb}
    *{box-sizing:border-box}body{margin:0}.app{max-width:900px;margin:auto;min-height:100vh;padding-bottom:110px}
    header{position:sticky;top:0;background:#fff;border-bottom:1px solid #e7e9ef;z-index:5;padding:14px 18px}
    header h1{margin:0;font-size:20px}.sub{color:#687386;font-size:12px;margin-top:3px}
    main{padding:16px}.panel{background:#fff;border:1px solid #e5e8ef;border-radius:18px;padding:14px;margin-bottom:14px}
    .grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.field label{font-size:12px;font-weight:700;display:block;margin-bottom:6px}
    select,textarea,input{width:100%;border:1px solid #dfe3eb;border-radius:12px;padding:10px;font:inherit;background:#fff}
    textarea{min-height:70px;resize:vertical}.note{font-size:11px;color:#737d8d;line-height:1.6}
    .chat{display:flex;flex-direction:column;gap:12px}.msg{max-width:82%;padding:12px 14px;border-radius:17px;box-shadow:0 2px 8px #0000000a}
    .partner{align-self:flex-start;background:#fff;border:1px solid #e3e6ec}.me{align-self:flex-end;background:#4f46e5;color:#fff}
    .meta{font-size:11px;opacity:.65;margin-bottom:5px}.analysis{margin-top:10px;padding:10px;border-radius:12px;background:#fff8e7;color:#5f4a16;white-space:pre-wrap;line-height:1.65;font-size:13px}
    .me .analysis{background:#3730a3;color:#eef2ff}.bar{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #e5e8ef;padding:10px}
    .barin{max-width:900px;margin:auto;display:flex;gap:8px;align-items:end}.barin textarea{min-height:46px;max-height:140px}
    button{border:0;border-radius:12px;padding:11px 15px;font-weight:700;cursor:pointer;background:#4f46e5;color:#fff}
    button:disabled{opacity:.5;cursor:wait}.ghost{background:#eef0f5;color:#394256}
    .warning{background:#fff7ed;border-color:#fed7aa}.title{font-weight:800;font-size:14px;margin-bottom:7px}
    @media(max-width:650px){.grid{grid-template-columns:1fr}.msg{max-width:92%}}
  </style>
</head>
<body>
<div class="app">
<header><h1>💬 ココロ翻訳</h1><div class="sub">相手の本心を断定するのではなく、会話の可能性を一緒に整理する</div></header>
<main>
  <section class="panel warning">
    <div class="title">このアプリの大事なルール</div>
    <div class="note">AIは相手の本心を知ることはできません。特性や過去の会話から「あり得る解釈」を整理します。診断結果ではなく、考えを整理するための補助として使ってください。</div>
  </section>

  <section class="panel">
    <div class="title">ふたりの特性（分からないものは空欄でOK）</div>
    <div class="grid">
      <div class="field"><label>自分</label><select id="myTrait" multiple size="5">
        <option>MBTI: INFP</option><option>MBTI: INTJ</option><option>HSP</option><option>ASD傾向</option>
        <option>ADHD傾向</option><option>恋愛: 不安型</option><option>恋愛: 回避型</option><option>恋愛: 安定型</option>
        <option>文字のニュアンスに敏感</option><option>シングルタスク思考</option>
      </select></div>
      <div class="field"><label>相手</label><select id="partnerTrait" multiple size="5">
        <option>MBTI: INFP</option><option>MBTI: INTJ</option><option>HSP</option><option>ASD傾向</option>
        <option>ADHD傾向</option><option>恋愛: 不安型</option><option>恋愛: 回避型</option><option>恋愛: 安定型</option>
        <option>文字のニュアンスに敏感</option><option>シングルタスク思考</option>
      </select></div>
    </div>
    <p class="note">複数選択は Ctrl / ⌘ を使います。スマホ版では後でチップ式UIに置き換える想定です。</p>
  </section>

  <section id="chat" class="chat"></section>
</main>
<div class="bar"><div class="barin">
  <div style="flex:1"><select id="sender"><option value="partner">相手の発言</option><option value="me">自分の発言</option></select>
  <textarea id="input" placeholder="LINEなどの発言を入力…"></textarea></div>
  <button id="send">翻訳する</button>
</div></div>
</div>

<script>
const chat = document.querySelector("#chat");
const input = document.querySelector("#input");
const send = document.querySelector("#send");

function selected(id){ return [...document.querySelector(id).selectedOptions].map(x=>x.value); }
function addMessage(who,text,analysis){
  const el=document.createElement("div"); el.className="msg "+(who==="partner"?"partner":"me");
  const meta=document.createElement("div"); meta.className="meta"; meta.textContent=who==="partner"?"相手":"自分";
  const body=document.createElement("div"); body.textContent=text;
  const a=document.createElement("div"); a.className="analysis"; a.textContent=analysis;
  el.append(meta,body,a); chat.appendChild(el); el.scrollIntoView({behavior:"smooth",block:"nearest"});
}
async function translate(){
  const text=input.value.trim(); if(!text)return;
  send.disabled=true; send.textContent="分析中…";
  try{
    const payload={
      myTraits:selected("#myTrait"), partnerTraits:selected("#partnerTrait"),
      sender:document.querySelector("#sender").value, message:text
    };
    const r=await fetch("/api/translate",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(payload)});
    const data=await r.json();
    if(!r.ok) throw new Error(data.error||"APIエラー");
    addMessage(payload.sender,text,data.text||"分析結果がありません。");
    input.value="";
  }catch(e){ alert("エラー: "+e.message); }
  finally{send.disabled=false;send.textContent="翻訳する";}
}
send.onclick=translate;
input.addEventListener("keydown",e=>{if(e.key==="Enter"&&(e.ctrlKey||e.metaKey)){e.preventDefault();translate();}});
</script>
</body>
</html>
