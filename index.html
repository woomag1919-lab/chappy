<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CoreLingual</title>
<style>
body{margin:0;background:#fafbfc;color:#30343b;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP",sans-serif}.app{max-width:760px;margin:auto;padding-bottom:40px}header{padding:18px 20px;color:#fff;background:linear-gradient(110deg,#ef6585,#d94788)}h1{margin:0}.sub{font-size:12px}nav{display:flex;gap:4px;margin:12px 14px}nav button{flex:1;padding:12px;border:0;border-radius:24px;font-weight:bold}nav .on{background:#ffeaf0;color:#c74369}main{padding:0 14px}.panel,.person,.card{background:#fff;border:1px solid #e5e8ed;border-radius:16px;padding:14px;margin-bottom:12px}.person{margin-top:10px}button,select,input,textarea{font:inherit}button{cursor:pointer}.actions{display:flex;gap:8px;margin:10px 0}
.spinner{display:inline-block;width:18px;height:18px;border:3px solid rgba(255,255,255,.45);border-top-color:#fff;border-radius:50%;animation:spin .8s linear infinite;vertical-align:-4px;margin-right:7px}
@keyframes spin{to{transform:rotate(360deg)}}
.loading-note{text-align:center;font-size:12px;color:#737b85;margin-top:8px}.action{flex:1;padding:11px;border:1px solid #ddd;border-radius:12px;background:#fff}.action.on{background:#fff0f5;border-color:#df6684}textarea,select,input[type=text]{width:100%;padding:10px;border:1px solid #dfe3e9;border-radius:10px;box-sizing:border-box}textarea{min-height:75px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.small{display:block;font-size:11px;font-weight:bold;margin:7px 0 5px}.chips,.profiles{display:flex;flex-wrap:wrap;gap:6px}.chip,.profile{padding:7px 9px;border:1px solid #ddd;border-radius:999px;background:#fff;font-size:11px}.chip.on{background:#ffeaf0;border-color:#df6684}.savebar{display:flex;gap:7px;margin-top:8px}.save{background:#343b44;color:white;border:0;border-radius:10px;padding:10px}.primary{width:100%;padding:14px;border:0;border-radius:13px;color:#fff;background:linear-gradient(100deg,#e84f78,#d94788);font-weight:bold}.upload{display:block;text-align:center;padding:18px;border:2px dashed #ccd4dd;border-radius:14px}.thumbs{display:flex;gap:7px;overflow:auto;margin-top:8px}.thumb{width:65px;height:65px;object-fit:cover;border-radius:8px}.q{padding:12px 0;border-top:1px solid #eee}.scale{display:flex;justify-content:space-between;font-size:11px}.badge{display:inline-block;padding:7px 10px;margin:3px;background:#fff0f5;border:1px solid #efcbd7;border-radius:999px;font-size:12px;font-weight:bold}@media(max-width:600px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body><div class="app">
<header><h1>CoreLingual</h1><div class="sub">会話と「特性」の違いを読み解くサポートアプリ</div></header>
<nav><button id="talkTab" class="on">💬 会話を読み解く</button><button id="diagTab">🧩 特性チェック</button></nav>
<main>
<section id="talk">
<div class="panel"><b>会話を入力</b><p style="font-size:12px;color:#717983">スクショは <b>右側＝自分</b>、<b>左側＝相手</b> として扱います。</p>
<div class="actions"><button id="textMode" class="action on">⌨️ テキスト入力</button><button id="imageMode" class="action">🖼️ スクショ送信</button></div>
<div id="textArea"><label class="small">この文章は誰の発言？</label><div class="actions"><button id="speakerMe" class="action on">👤 自分</button><button id="speakerPartner" class="action">👥 相手</button><button id="speakerUnknown" class="action">❓ 不明</button></div><textarea id="message" placeholder="気になったメッセージや会話を入力…"></textarea></div>
<div id="imageArea" style="display:none"><label class="upload" for="images">🖼️ <b>スクショを追加</b><br><small>LINE・DM・SMSなど、最大5枚</small></label><input id="images" type="file" accept="image/*" multiple style="display:none"><div id="thumbs" class="thumbs"></div><div id="imageControls" style="display:none;margin-top:8px"><button id="clearImages" class="action">🗑️ 選択したスクショを全部削除</button></div></div></div>
<div class="panel"><b>特性プロフィール</b><p style="font-size:12px;color:#717983">自分・相手を分けて保存できます。</p>
<div class="person"><h3>👤 自分</h3><div class="grid"><div><label class="small">MBTI</label><select id="myMbti"><option value="">未設定</option></select></div><div><label class="small">特性</label><div id="myTraits" class="chips"></div></div></div><label class="small">自由記入</label><textarea id="myFree" placeholder="自分について…"></textarea><div class="savebar"><input id="myName" type="text" placeholder="プロフィール名"><button id="saveMy" class="save">保存</button></div><div id="myProfiles" class="profiles"></div></div>
<div class="person"><h3>👥 相手</h3><div class="grid"><div><label class="small">MBTI</label><select id="partnerMbti"><option value="">未設定</option></select></div><div><label class="small">特性</label><div id="partnerTraits" class="chips"></div></div></div><label class="small">自由記入</label><textarea id="partnerFree" placeholder="相手について…"></textarea><div class="savebar"><input id="partnerName" type="text" placeholder="例：友達A、恋人"><button id="savePartner" class="save">保存</button></div><div id="partnerProfiles" class="profiles"></div></div></div>
<button id="analyze" class="primary">✨ 分析・アドバイスを表示する</button><div id="result"></div>
</section>
<section id="diag" style="display:none"><div class="panel"><b>🧩 特性チェック</b><p style="font-size:12px;color:#717983">医療的な診断ではなく、自己理解のための「〇〇傾向」チェックです。</p>
<div class="actions"><button id="selfDiag" class="action on">👤 自分をチェック</button><button id="otherDiag" class="action">👥 相手をチェック</button></div><div id="targetNote" style="font-size:12px;color:#717983">自分自身について回答してください。</div><div id="questions"></div><button id="runDiag" class="primary">📊 結果を見る</button><div id="diagResult"></div></div></section>
</main></div>
<script>
const MBTI=["INTJ","INTP","ENTJ","ENTP","INFJ","INFP","ENFJ","ENFP","ISTJ","ISFJ","ESTJ","ESFJ","ISTP","ISFP","ESTP","ESFP"];
const TRAITS=["HSP","HSS型HSP","ASD傾向","ADHD傾向","恋愛：不安型","恋愛：回避型","恋愛：安定型","文字のニュアンスに敏感","こだわりが強め","切り替えが苦手"];
["myMbti","partnerMbti"].forEach(id=>MBTI.forEach(x=>document.getElementById(id).insertAdjacentHTML("beforeend",`<option>${x}</option>`)));
function makeTraits(id){const e=document.getElementById(id);TRAITS.forEach(t=>{const b=document.createElement("button");b.className="chip";b.type="button";b.textContent=t;b.onclick=()=>b.classList.toggle("on");e.appendChild(b)})}makeTraits("myTraits");makeTraits("partnerTraits");
textMode.onclick=()=>setMode("text");imageMode.onclick=()=>setMode("image");function setMode(x){textMode.classList.toggle("on",x==="text");imageMode.classList.toggle("on",x==="image");textArea.style.display=x==="text"?"block":"none";imageArea.style.display=x==="image"?"block":"none"}
talkTab.onclick=()=>{talk.style.display="block";diag.style.display="none";talkTab.classList.add("on");diagTab.classList.remove("on")};diagTab.onclick=()=>{talk.style.display="none";diag.style.display="block";diagTab.classList.add("on");talkTab.classList.remove("on")};
let selectedImages=[];
function drawImages(){
  thumbs.innerHTML="";
  selectedImages.forEach((f,idx)=>{
    let wrap=document.createElement("div");wrap.style.cssText="position:relative;flex:0 0 auto";
    let i=document.createElement("img");i.className="thumb";i.src=URL.createObjectURL(f);
    let x=document.createElement("button");x.type="button";x.textContent="×";x.title="この画像を削除";
    x.style.cssText="position:absolute;right:-5px;top:-5px;width:23px;height:23px;border:0;border-radius:50%;background:#333;color:#fff;font-weight:bold;padding:0";
    x.onclick=()=>{selectedImages.splice(idx,1);drawImages()};
    wrap.appendChild(i);wrap.appendChild(x);thumbs.appendChild(wrap);
  });
  imageControls.style.display=selectedImages.length?"block":"none";
}
images.onchange=()=>{selectedImages=[...selectedImages,...images.files].slice(0,5);images.value="";drawImages()};
clearImages.onclick=()=>{selectedImages=[];drawImages()};
let currentSpeaker="me";
function setSpeaker(x){currentSpeaker=x;speakerMe.classList.toggle("on",x==="me");speakerPartner.classList.toggle("on",x==="partner");speakerUnknown.classList.toggle("on",x==="unknown")}
speakerMe.onclick=()=>setSpeaker("me");speakerPartner.onclick=()=>setSpeaker("partner");speakerUnknown.onclick=()=>setSpeaker("unknown");
function state(p){return{mbti:document.getElementById(p+"Mbti").value,traits:[...document.querySelectorAll("#"+p+"Traits .on")].map(x=>x.textContent),free:document.getElementById(p+"Free").value}}
function apply(p,s){document.getElementById(p+"Mbti").value=s.mbti||"";document.getElementById(p+"Free").value=s.free||"";document.querySelectorAll("#"+p+"Traits .chip").forEach(x=>x.classList.toggle("on",(s.traits||[]).includes(x.textContent)))}
function list(p){try{return JSON.parse(localStorage.getItem("cl_"+p)||"[]")}catch{return[]}}
function draw(p){const e=document.getElementById(p+"Profiles");e.innerHTML="";list(p).forEach(x=>{let b=document.createElement("button");b.className="profile";b.textContent=x.name;b.onclick=()=>apply(p,x.state);e.appendChild(b)})}
function save(p){let name=document.getElementById(p+"Name").value.trim()||"プロフィール "+(list(p).length+1),a=list(p);a.push({name,state:state(p)});a=a.slice(-5);localStorage.setItem("cl_"+p,JSON.stringify(a));document.getElementById(p+"Name").value="";draw(p)}
saveMy.onclick=()=>save("my");savePartner.onclick=()=>save("partner");draw("my");draw("partner");
function render(d){result.innerHTML="";for(const [title,key] of [["🧾 会話から確認できること","observed"],["🌸 考えられる解釈","likely"],["🔎 別の可能性","alternatives"],["🧩 すれ違いポイント","mismatch"],["💬 伝え方の例","reply"],["⚠️ まだ分からないこと","caution"]])if(d[key]){let c=document.createElement("div");c.className="card";c.innerHTML="<b>"+title+"</b><p></p>";c.querySelector("p").textContent=d[key];result.appendChild(c)}}
analyze.onclick=async()=>{
  analyze.disabled=true;
  const originalText=analyze.innerHTML;
  analyze.innerHTML='<span class="spinner"></span>分析中…';
  let note=document.getElementById("loadingNote");
  if(!note){note=document.createElement("div");note.id="loadingNote";note.className="loading-note";analyze.after(note)}
  note.textContent="会話を読み込んでいます。スクショが多い場合は少し時間がかかります…";
  try{
    let body={inputMode:textArea.style.display!=="none"?"text":"image",message:message.value,speaker:currentSpeaker,
      myMbti:myMbti.value,partnerMbti:partnerMbti.value,myTraits:state("my").traits,partnerTraits:state("partner").traits,
      myFree:myFree.value,partnerFree:partnerFree.value,images:[]};
    if(body.inputMode==="image")for(const f of selectedImages){
      const r=await new Promise(ok=>{let fr=new FileReader();fr.onload=()=>ok(fr.result.split(",")[1]);fr.readAsDataURL(f)});
      body.images.push(r);
    }
    let r=await fetch("/api/translate",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});
    let d=await r.json();if(!r.ok)throw Error(d.error||"APIエラー");render(d);note.textContent="分析が完了しました。";
  }catch(e){result.innerHTML='<div class="card"><b>エラー</b><p></p></div>';result.querySelector("p").textContent=e.message;note.textContent="分析に失敗しました。";
  }finally{analyze.disabled=false;analyze.innerHTML=originalText;}
};
const Q=[["言葉のニュアンスや人の感情の変化に気づきやすい","HSP傾向"],["刺激が多い場所や状況で疲れやすい","HSP傾向"],["新しい刺激や冒険を楽しみたい","HSS傾向"],["興味を持つと一気に集中しやすい","ADHD傾向"],["予定変更や急な割り込みが負担になりやすい","ASD傾向"],["曖昧な説明より具体的な説明が好き","ASD傾向"],["気になることを何度も考えやすい","HSP傾向"],["関係性の変化に敏感になりやすい","愛着：不安型傾向"],["嫌われたかもしれないと不安になりやすい","愛着：不安型傾向"],["距離が近くなると少し離れたくなる","愛着：回避型傾向"],["安心できる関係では相手を信頼しやすい","愛着：安定型傾向"]];
Q.forEach((q,i)=>questions.insertAdjacentHTML("beforeend",`<div class="q"><b>${i+1}. ${q[0]}</b><div class="scale">${[1,2,3,4,5].map(v=>`<label><input type="radio" name="q${i}" value="${v}">${v}</label>`).join("")}</div></div>`));
let target="my";selfDiag.onclick=()=>{target="my";selfDiag.classList.add("on");otherDiag.classList.remove("on");targetNote.textContent="自分自身について回答してください。"};otherDiag.onclick=()=>{target="partner";otherDiag.classList.add("on");selfDiag.classList.remove("on");targetNote.textContent="相手について、分かる範囲で回答してください。本人の回答ではないため参考程度に。"};
runDiag.onclick=()=>{let s={};for(let i=0;i<Q.length;i++){let x=document.querySelector(`input[name="q${i}"]:checked`);if(!x){alert("全11問に回答してください。");return}s[Q[i][1]]=(s[Q[i][1]]||0)+Number(x.value)}let a=Object.entries(s).sort((x,y)=>y[1]-x[1]);diagResult.innerHTML='<div class="card"><b>今回のチェック結果</b><p>比較的高かった傾向：</p><div id="badges"></div><p>これは診断ではなく、プロフィール設定の参考情報です。</p><button id="apply" class="action">選んだ傾向をプロフィールへ反映</button></div>';a.slice(0,5).filter(x=>x[1]>=7).forEach(x=>{let b=document.createElement("span");b.className="badge";b.textContent=x[0];badges.appendChild(b)});document.getElementById("apply").onclick=()=>{let id=target==="my"?"myTraits":"partnerTraits";a.slice(0,5).filter(x=>x[1]>=7).forEach(x=>{document.querySelectorAll("#"+id+" .chip").forEach(c=>{let k=x[0].replace("傾向","");if(c.textContent===k||c.textContent.includes(k)||(x[0]==="HSS傾向"&&c.textContent==="HSS型HSP"))c.classList.add("on")})});alert("プロフィールに反映しました。必要なら保存してください。")}}
</script></body></html>
